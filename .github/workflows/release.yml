name: Release

# Builds the app from the tagged source in CI (never on a developer PC), optionally signs it through
# SignPath, writes checksums, records build provenance, and publishes a GitHub release.
# Signing runs only when the repository variable SIGNPATH_ORGANIZATION_ID is set. Until SignPath approves the
# project, releases are built unsigned and the README says so.

on:
  push:
    tags: ['v*']

permissions:
  contents: write        # create the release
  id-token: write        # build provenance
  attestations: write    # build provenance
  actions: read          # SignPath reads this run

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Test engine
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 6.2.0 -Force -SkipPublisherCheck -Scope CurrentUser
          Invoke-Pester -Path tests -CI

      - name: Build app
        shell: pwsh
        run: dotnet publish app/PcGuardian.App -c Release --self-contained false -o publish

      - name: Keep the unsigned build
        id: unsigned
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unsigned
          path: publish

      # Signing template. Inputs were checked against the pinned action's action.yml.
      # Needs: variable SIGNPATH_ORGANIZATION_ID, SIGNPATH_CONNECTOR_URL, SIGNPATH_PROJECT_SLUG,
      # SIGNPATH_POLICY_SLUG; secret SIGNPATH_API_TOKEN. Not yet exercised: the project is not approved.
      - name: Sign with SignPath
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@ced31329c0317e779dad2eec2a7c3bb46ea1343e
        with:
          connector-url: ${{ vars.SIGNPATH_CONNECTOR_URL }}
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Package and checksum
        id: pack
        shell: pwsh
        run: |
          $src = if (Test-Path signed) { 'signed' } else { 'publish' }
          $zip = "pc-guardian-${{ github.ref_name }}-win-x64.zip"
          Compress-Archive -Path "$src\*" -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Set-Content "$zip.sha256" -Encoding ASCII
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Record build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: ${{ steps.pack.outputs.zip }}

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "${{ steps.pack.outputs.zip }}" "${{ steps.pack.outputs.zip }}.sha256" --title "${{ github.ref_name }}" --generate-notes
