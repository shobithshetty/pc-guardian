name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repo.
permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      # Pinned to a full commit SHA (v4). A tag can be moved to point at different code; a SHA cannot.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install tooling (exact versions)
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 6.2.0 -Force -SkipPublisherCheck -Scope CurrentUser
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser

      - name: Lint
        shell: pwsh
        run: |
          $r = Invoke-ScriptAnalyzer -Path src, installer -Recurse -Severity Error,Warning
          $r | Format-Table -AutoSize
          if ($r | Where-Object Severity -eq 'Error') { exit 1 }

      - name: Test (PowerShell 7)
        shell: pwsh
        run: Invoke-Pester -Path tests -CI

      - name: Build Windows app
        shell: pwsh
        run: dotnet build app/PcGuardian.App -c Release

      # The app also runs on Windows PowerShell 5.1, which behaves differently (JSON arrays, TLS defaults).
      - name: Test (Windows PowerShell 5.1)
        shell: powershell
        run: |
          Install-Module Pester -RequiredVersion 5.9.1 -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -RequiredVersion 5.9.1
          Invoke-Pester -Path tests -CI
